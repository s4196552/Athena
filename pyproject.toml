[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athena-engine"
version = "0.1.0"
description = "Read-only local indexing engine for the Athena Data Manager"
requires-python = ">=3.10"
dependencies = [
  "blake3>=0.4",          # fast content hashing, releases the GIL
  "puremagic>=1.28",      # pure-python content sniffing (no libmagic DLL on Windows)
]

[project.optional-dependencies]
# Tier 2 -- cheap, deterministic metadata. Install this for a useful product.
media = [
  "Pillow>=10.3",
  "pillow-heif>=0.16",
  "mutagen>=1.47",        # ID3/FLAC/WAV/MP4 tags
  "av>=12.0",             # PyAV: ffmpeg bindings, no subprocess, no temp files
]
docs = [
  "pypdfium2>=4.30",      # Apache-2.0 PDFium: text + raster. NOT PyMuPDF (AGPL).
  "pdfminer.six>=20240706",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "lxml>=5.2",
]
# Tier 3 -- ML. Heavy; gated behind an explicit opt-in in the UI.
#
# `rapidocr`, not `rapidocr-onnxruntime`: the project renamed, and the old
# distribution stopped at 1.2.3 with no wheel for Python 3.13 or 3.14, so
# `pip install .[ml]` simply failed on a current interpreter. The two ship the
# same models behind different imports and different return types --
# athena/extractors/_ocr.py accepts either, so an environment that already has
# the old one keeps working.
ml = [
  "onnxruntime>=1.18",    # swap for onnxruntime-directml / -gpu per platform
  "rapidocr>=2.0",
  "numpy>=1.26",
]
watch = ["watchdog>=4.0"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
athena-engine = "athena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
